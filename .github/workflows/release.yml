name: Release

# Pushing a tag like v2.0 builds the app on a macOS runner and attaches the zip to that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach to"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build and package
        run: ./package.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Windows App Runner ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
